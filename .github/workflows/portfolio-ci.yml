name: Portfolio CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run Campaign Research Agent adapter unit tests
        run: python -m unittest discover -s projects/campaign-research-agent/local-crawl4ai -p "test_*.py" -v

      - name: Run portfolio integrity, link, JSON, and secret-hygiene checks
        run: python -m unittest discover -s tests -p "test_*.py" -v
