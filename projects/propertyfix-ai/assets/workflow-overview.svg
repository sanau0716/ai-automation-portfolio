<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
<title id="title">PropertyFix AI 2.0 workflow and synthetic test evidence</title><desc id="desc">A 17-node human-supervised maintenance triage workflow: internal intake, validation, raw request persistence, AI classification, deterministic safety rules, triage persistence, emergency or standard manager notifications, approval and decision logging. Includes synthetic regression cases.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071525"/><stop offset=".6" stop-color="#111d36"/><stop offset="1" stop-color="#211d3c"/></linearGradient><linearGradient id="line"><stop stop-color="#ffb86b"/><stop offset="1" stop-color="#a58bff"/></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000" flood-opacity=".2"/></filter><style>.ey{font:700 14px Arial,sans-serif;letter-spacing:2px;fill:#ffbf7d}.h{font:750 37px Arial,sans-serif;fill:#f7fbff}.sub{font:17px Arial,sans-serif;fill:#a8bfd8}.ct{font:700 17px Arial,sans-serif;fill:#f5f8ff}.bd{font:14px Arial,sans-serif;fill:#b8c9df}.sm{font:12px Arial,sans-serif;fill:#8ea5bf}.num{font:700 25px Arial,sans-serif;fill:#fff}.line{fill:none;stroke:url(#line);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}</style></defs>
<rect width="1440" height="900" rx="24" fill="url(#bg)"/><circle cx="1330" cy="40" r="220" fill="#a46b35" opacity=".1"/>
<text x="60" y="62" class="ey">PROPERTY OPERATIONS · HUMAN-SUPERVISED PROOF OF CONCEPT</text><text x="60" y="112" class="h">PropertyFix AI 2.0 — safe triage, not auto-dispatch</text><text x="60" y="145" class="sub">AI proposes classification; deterministic rules and a manager decision control the next step.</text>
<rect x="1145" y="54" width="235" height="42" rx="21" fill="#3b2d21" stroke="#ffb86b"/><text x="1262" y="80" text-anchor="middle" style="font:700 12px Arial;letter-spacing:1px;fill:#ffe0bc">17 NODES · INTERNAL POC</text>
<g filter="url(#shadow)">
 <rect x="60" y="210" width="210" height="120" rx="16" fill="#2b2939" stroke="#ffb86b"/><rect x="305" y="210" width="210" height="120" rx="16" fill="#202a42" stroke="#536e93"/><rect x="550" y="210" width="210" height="120" rx="16" fill="#202a42" stroke="#536e93"/><rect x="795" y="210" width="210" height="120" rx="16" fill="#202a42" stroke="#536e93"/><rect x="1040" y="210" width="340" height="120" rx="16" fill="#202a42" stroke="#a58bff"/>
</g>
<text x="84" y="246" class="ey">01 · INTAKE</text><text x="84" y="282" class="ct">Internal form</text><text x="84" y="307" class="bd">Maintenance request</text>
<text x="329" y="246" class="ey">02 · VALIDATE</text><text x="329" y="282" class="ct">Normalize fields</text><text x="329" y="307" class="bd">Reject incomplete requests</text>
<text x="574" y="246" class="ey">03 · PRESERVE</text><text x="574" y="282" class="ct">Save raw request</text><text x="574" y="307" class="bd">Case ledger before AI</text>
<text x="819" y="246" class="ey">04 · INTERPRET</text><text x="819" y="282" class="ct">AI classification</text><text x="819" y="307" class="bd">Trade, priority, confidence</text>
<text x="1064" y="246" class="ey">05 · DETERMINISTIC GUARDRAILS</text><text x="1064" y="282" class="ct">Safety + confidence rules</text><text x="1064" y="307" class="bd">Override risky AI classifications</text>
<g class="line"><path d="M270 270h29"/><path d="M515 270h29"/><path d="M760 270h29"/><path d="M1005 270h29"/></g>
<rect x="550" y="390" width="340" height="82" rx="16" fill="#2b2939" stroke="#ffb86b" stroke-width="1.5"/><text x="720" y="424" text-anchor="middle" class="ey">06 · PERSIST TRIAGE</text><text x="720" y="451" text-anchor="middle" class="bd">Save category, priority, flags and status</text><path class="line" d="M1210 330v34H720v16"/>
<rect x="550" y="520" width="340" height="76" rx="16" fill="#2b2939" stroke="#ffb86b" stroke-width="1.5"/><text x="720" y="550" text-anchor="middle" class="ey">POTENTIAL EMERGENCY?</text><text x="720" y="576" text-anchor="middle" class="bd">Separate escalation routes</text><path class="line" d="M720 472v38"/>
<rect x="90" y="650" width="500" height="108" rx="16" fill="#33251f" stroke="#ff9b66" stroke-width="1.5"/><text x="116" y="686" class="ey">YES · EMERGENCY REVIEW</text><text x="116" y="722" class="ct">Manager Gmail + emergency Slack alert</text><text x="116" y="744" class="bd">Manager decision is still required</text>
<rect x="850" y="650" width="500" height="108" rx="16" fill="#1d2d42" stroke="#6bb5c8" stroke-width="1.5"/><text x="876" y="686" class="ey" style="fill:#8de4ee">NO · STANDARD REVIEW</text><text x="876" y="722" class="ct">Manager queue + standard Slack alert</text><text x="876" y="744" class="bd">Approval decision is persisted in the case ledger</text>
<path class="line" d="M550 558H340v82"/><path class="line" d="M890 558h210v82"/>
<rect x="60" y="790" width="1320" height="76" rx="15" fill="#102c3c" stroke="#42d9e8" stroke-width="1.2"/><text x="86" y="820" class="ey">SYNTHETIC REGRESSION EVIDENCE · NOV 1–21, 2026</text><text x="86" y="851" class="num">10 / 10</text><text x="210" y="850" class="bd">successful test executions</text><text x="570" y="850" class="bd">#405 negated hazards → routine · #406 real sparks/smoke → emergency</text>
<text x="60" y="885" class="sm">Gmail/Slack workflow notifications and approval responses were pinned/simulated in the documented tests. No contractor dispatch or emergency response is automated.</text>
