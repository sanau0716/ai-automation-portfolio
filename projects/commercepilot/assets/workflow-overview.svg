<title id="title">CommercePilot architecture and verification snapshot</title><desc id="desc">Shopify storefront requests pass through App Proxy HMAC verification, normalization and Redis security before store and catalog context, product matching, Groq reasoning, optional live variant availability, conversation logging and response. Includes the draft and published release boundary and execution evidence.</desc>
