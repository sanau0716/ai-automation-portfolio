<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="920" viewBox="0 0 1440 920" role="img" aria-labelledby="title desc">
<title id="title">CommercePilot architecture and verification snapshot</title><desc id="desc">Shopify storefront requests pass through App Proxy HMAC verification, request validation and Redis security, then store and catalog context, product matching and a stock-question decision. Live Shopify variant availability is checked when needed before the Groq assistant builds a grounded answer, logs the conversation and responds. Includes release boundary and execution evidence.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071525"/><stop offset=".58" stop-color="#101d35"/><stop offset="1" stop-color="#171d3c"/></linearGradient><linearGradient id="line" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#48dce8"/><stop offset="1" stop-color="#8b7bff"/></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="9" stdDeviation="9" flood-color="#000" flood-opacity=".22"/></filter><style>.ey{font:700 14px Arial,sans-serif;letter-spacing:2px;fill:#62dce9}.h{font:750 38px Arial,sans-serif;fill:#f7fbff}.sub{font:17px Arial,sans-serif;fill:#a8bfd8}.ct{font:700 17px Arial,sans-serif;fill:#f5f8ff}.bd{font:14px Arial,sans-serif;fill:#b8c9df}.sm{font:12px Arial,sans-serif;fill:#8ea5bf}.pill{font:700 12px Arial,sans-serif;letter-spacing:1px;fill:#e6f7ff}.num{font:700 25px Arial,sans-serif;fill:#fff}.line{fill:none;stroke:url(#line);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}</style></defs>
<rect width="1440" height="920" rx="24" fill="url(#bg)"/><circle cx="1340" cy="55" r="210" fill="#5947a8" opacity=".13"/>
<text x="60" y="62" class="ey">SHOPIFY AI COMMERCE · CURRENT CONNECTED WORKFLOW</text><text x="60" y="112" class="h">CommercePilot — request to grounded answer</text><text x="60" y="145" class="sub">Secure storefront intake · catalog context · conditional live availability · AI response · conversation record</text>
