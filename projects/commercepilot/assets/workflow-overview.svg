<text x="78" y="244" class="ey">01 · ENTRY</text><text x="78" y="280" class="ct">Shopify chat</text><text x="78" y="307" class="bd">Theme app embed</text>
<text x="318" y="244" class="ey">02 · TRUST</text><text x="318" y="280" class="ct">App Proxy</text><text x="318" y="307" class="bd">Envelope + HMAC</text>
<text x="558" y="244" class="ey">03 · GATE</text><text x="558" y="280" class="ct">Validate request</text><text x="558" y="307" class="bd">Redis replay / rate</text>
