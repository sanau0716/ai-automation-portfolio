<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
<title id="title">Smart Scheduler V1 workflow and test evidence</title><desc id="desc">A 30-node email-to-calendar workflow with Gmail screening, persistent deduplication, structured AI event extraction, deterministic date validation, calendar conflict checks, explicit human approval, a second ledger and calendar check, event creation and error alerting.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071525"/><stop offset=".6" stop-color="#111d36"/><stop offset="1" stop-color="#1d1d42"/></linearGradient><linearGradient id="line"><stop stop-color="#8979ff"/><stop offset="1" stop-color="#4de6f1"/></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000" flood-opacity=".2"/></filter><style>.ey{font:700 14px Arial,sans-serif;letter-spacing:2px;fill:#a997ff}.h{font:750 37px Arial,sans-serif;fill:#f7fbff}.sub{font:17px Arial,sans-serif;fill:#a8bfd8}.ct{font:700 17px Arial,sans-serif;fill:#f5f8ff}.bd{font:14px Arial,sans-serif;fill:#b8c9df}.sm{font:12px Arial,sans-serif;fill:#8ea5bf}.num{font:700 25px Arial,sans-serif;fill:#fff}.line{fill:none;stroke:url(#line);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}</style></defs>
<rect width="1440" height="900" rx="24" fill="url(#bg)"/><circle cx="1320" cy="30" r="220" fill="#5148a8" opacity=".12"/>
<text x="60" y="62" class="ey">PERSONAL PRODUCTIVITY · ACTIVE 30-NODE WORKFLOW</text><text x="60" y="112" class="h">Smart Scheduler V1 — approve before calendar writes</text><text x="60" y="145" class="sub">AI extracts candidate event details; validation, deduplication and human approval control creation.</text>
<rect x="1145" y="54" width="235" height="42" rx="21" fill="#2b2852" stroke="#8979ff"/><text x="1262" y="80" text-anchor="middle" style="font:700 12px Arial;letter-spacing:1px;fill:#d0c5ff">30 NODES · ACTIVE</text>
<g filter="url(#shadow)">
 <rect x="60" y="210" width="210" height="120" rx="16" fill="#1b2843" stroke="#8979ff"/><rect x="305" y="210" width="210" height="120" rx="16" fill="#1b2843" stroke="#536e93"/><rect x="550" y="210" width="210" height="120" rx="16" fill="#1b2843" stroke="#536e93"/><rect x="795" y="210" width="210" height="120" rx="16" fill="#1b2843" stroke="#536e93"/><rect x="1040" y="210" width="340" height="120" rx="16" fill="#1b2843" stroke="#8979ff"/>
</g>
<text x="84" y="246" class="ey">01 · INTAKE</text><text x="84" y="282" class="ct">Gmail screening</text><text x="84" y="307" class="bd">Monitor or manual test</text>
<text x="329" y="246" class="ey">02 · DEDUPE</text><text x="329" y="282" class="ct">Message ledger</text><text x="329" y="307" class="bd">Skip previously processed</text>
<text x="574" y="246" class="ey">03 · EXTRACT</text><text x="574" y="282" class="ct">OpenRouter AI</text><text x="574" y="307" class="bd">Structured event details</text>
<text x="819" y="246" class="ey">04 · VALIDATE</text><text x="819" y="282" class="ct">Date + timezone</text><text x="819" y="307" class="bd">Reject ambiguous details</text>
<text x="1064" y="246" class="ey">05 · PRE-CHECK</text><text x="1064" y="282" class="ct">Google Calendar overlap</text><text x="1064" y="307" class="bd">Duplicate and conflict screening</text>
<g class="line"><path d="M270 270h29"/><path d="M515 270h29"/><path d="M760 270h29"/><path d="M1005 270h29"/></g>
<rect x="530" y="400" width="380" height="86" rx="16" fill="#242344" stroke="#8979ff" stroke-width="1.5"/><text x="720" y="434" text-anchor="middle" class="ey">06 · HUMAN APPROVAL</text><text x="720" y="463" text-anchor="middle" class="bd">Explicit Gmail approve / reject response</text><path class="line" d="M1210 330v50H720v20"/>
<rect x="530" y="535" width="380" height="100" rx="16" fill="#1a3045" stroke="#4de6f1" stroke-width="1.5"/><text x="720" y="570" text-anchor="middle" class="ey" style="fill:#70e4ee">07 · FINAL RECHECK</text><text x="720" y="599" text-anchor="middle" class="bd">Approval freshness + ledger + calendar slot</text><text x="720" y="620" text-anchor="middle" class="sm">Do not write if approval is stale or slot is occupied</text><path class="line" d="M720 486v42"/>
<rect x="1050" y="535" width="330" height="100" rx="16" fill="#183448" stroke="#4fd6b2" stroke-width="1.5"/><text x="1076" y="570" class="ey" style="fill:#82e8c6">08 · WRITE + AUDIT</text><text x="1076" y="602" class="ct">Create calendar event</text><text x="1076" y="622" class="bd">Persist event ID in ledger</text><path class="line" d="M910 585h130"/>
<rect x="60" y="535" width="390" height="100" rx="16" fill="#29243d" stroke="#a997ff" stroke-width="1.3"/><text x="86" y="570" class="ey">REJECT / STALE / CONFLICT</text><text x="86" y="603" class="ct">Stop before calendar write</text><text x="86" y="623" class="bd">Notify when approval expires or slot changes</text>
<path class="line" d="M530 585H460"/>
<rect x="60" y="690" width="1320" height="118" rx="16" fill="#102c3c" stroke="#42d9e8" stroke-width="1.2"/><text x="86" y="727" class="ey">VERIFIED EXECUTION EVIDENCE · NOV 1–21, 2026</text><text x="86" y="771" class="num">20 / 20</text><text x="210" y="770" class="bd">successful execution records</text><text x="560" y="757" class="bd">#395 real event creation + ledger write · #385 rejection stopped before write</text><text x="560" y="784" class="bd">#390 simulated new conflict blocked · #398 alert-node delivery tested (Error Trigger not fired)</text>
<text x="60" y="850" class="sm">Runs on the author's own Gmail / Google Calendar account. Sustained production polling, concurrency and load testing remain unverified.</text>
<text x="1380" y="850" text-anchor="end" class="sm">Simplified diagram from connected n8n metadata, not a raw canvas screenshot.</text>
</svg>