<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="960" viewBox="0 0 1440 960" role="img" aria-labelledby="title desc">
<title id="title">AI Lead Qualification and Automation Platform workflow</title><desc id="desc">Current 18-node active website-connected workflow. Webhook intake is normalized, qualified by an OpenRouter AI agent, parsed and recorded in Google Sheets, then routed through high-value and qualified decisions into Gmail follow-up and status updates.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071525"/><stop offset=".6" stop-color="#111d36"/><stop offset="1" stop-color="#18203e"/></linearGradient><linearGradient id="line"><stop stop-color="#4de6f1"/><stop offset="1" stop-color="#8b76ff"/></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000" flood-opacity=".2"/></filter><style>.ey{font:700 14px Arial,sans-serif;letter-spacing:2px;fill:#62dce9}.h{font:750 37px Arial,sans-serif;fill:#f7fbff}.sub{font:17px Arial,sans-serif;fill:#a8bfd8}.ct{font:700 17px Arial,sans-serif;fill:#f5f8ff}.bd{font:14px Arial,sans-serif;fill:#b8c9df}.sm{font:12px Arial,sans-serif;fill:#8ea5bf}.num{font:700 25px Arial,sans-serif;fill:#fff}.line{fill:none;stroke:url(#line);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}</style></defs>
<rect width="1440" height="960" rx="24" fill="url(#bg)"/><circle cx="1320" cy="30" r="220" fill="#5148a8" opacity=".12"/>
<text x="60" y="62" class="ey">AwtomateAI · WEBSITE-CONNECTED LEAD WORKFLOW</text><text x="60" y="112" class="h">AI Lead Qualification &amp; Automation Platform</text><text x="60" y="145" class="sub">An active 18-node n8n workflow: classify, record, route and prepare personalized follow-up.</text>
<rect x="1130" y="54" width="250" height="42" rx="21" fill="#123d39" stroke="#3dd5a5"/><text x="1255" y="80" text-anchor="middle" style="font:700 12px Arial;letter-spacing:1px;fill:#9af0cf">ACTIVE · 18 NODES</text>
<g filter="url(#shadow)">
 <rect x="60" y="210" width="280" height="112" rx="16" fill="#122940" stroke="#42d9e8"/><rect x="390" y="210" width="280" height="112" rx="16" fill="#122940" stroke="#42d9e8"/><rect x="720" y="210" width="280" height="112" rx="16" fill="#122940" stroke="#42d9e8"/><rect x="1050" y="210" width="330" height="112" rx="16" fill="#122940" stroke="#42d9e8"/>
</g>
<text x="84" y="246" class="ey">01 · INTAKE</text><text x="84" y="282" class="ct">Website webhook</text><text x="84" y="305" class="bd">New inquiry received</text>
<text x="414" y="246" class="ey">02 · NORMALIZE</text><text x="414" y="282" class="ct">Lead data</text><text x="414" y="305" class="bd">Clean and prepare fields</text>
<text x="744" y="246" class="ey">03 · AI ASSESS</text><text x="744" y="282" class="ct">OpenRouter agent</text><text x="744" y="305" class="bd">Structured qualification</text>
<text x="1074" y="246" class="ey">04 · PARSE RESULT</text><text x="1074" y="282" class="ct">Qualification fields</text><text x="1074" y="305" class="bd">Score and routing data</text>
<g class="line"><path d="M340 266h45"/><path d="M670 266h45"/><path d="M1000 266h45"/></g>
<rect x="1050" y="385" width="330" height="84" rx="15" fill="#182b43" stroke="#4fd6b2" stroke-width="1.4"/><text x="1076" y="419" class="ey" style="fill:#82e8c6">RECORD ALL INQUIRIES</text><text x="1076" y="448" class="ct">Append lead row · Google Sheets</text>
<path class="line" d="M1215 322v52"/>
<rect x="520" y="385" width="330" height="84" rx="15" fill="#202744" stroke="#8b7bff" stroke-width="1.5"/><text x="685" y="419" text-anchor="middle" class="ey" style="fill:#b9a6ff">HIGH-VALUE LEAD?</text><text x="685" y="448" text-anchor="middle" class="bd">First routing decision</text>
<path class="line" d="M1215 322v34H685v20"/>
<rect x="60" y="535" width="390" height="125" rx="16" fill="#182b43" stroke="#4fd6b2" stroke-width="1.5"/><text x="86" y="571" class="ey" style="fill:#82e8c6">YES · HIGH VALUE</text><text x="86" y="608" class="ct">Owner alert → follow-up email</text><text x="86" y="635" class="bd">Update high-value lead status</text>
<rect x="520" y="535" width="330" height="125" rx="16" fill="#202744" stroke="#5e83ba" stroke-width="1.5"/><text x="685" y="571" text-anchor="middle" class="ey">NO · QUALIFIED?</text><text x="685" y="608" text-anchor="middle" class="ct">Second routing decision</text><text x="685" y="635" text-anchor="middle" class="bd">Check qualification branch</text>
<path class="line" d="M520 427H255v100"/><path class="line" d="M685 469v60"/>
<rect x="60" y="710" width="590" height="110" rx="16" fill="#182b43" stroke="#5e83ba" stroke-width="1.5"/><text x="86" y="746" class="ey">YES · QUALIFIED</text><text x="86" y="783" class="ct">Prepare context → AI personalized follow-up → Gmail</text><text x="86" y="806" class="bd">Update qualified lead status</text>
<rect x="720" y="710" width="660" height="110" rx="16" fill="#202744" stroke="#b18cff" stroke-width="1.5"/><text x="746" y="746" class="ey" style="fill:#c7b0ff">NO · LOWER VALUE</text><text x="746" y="783" class="ct">Alternate follow-up email → update low-value lead status</text><text x="746" y="806" class="bd">The branch remains a routed response, not an unrecorded discard</text>
<path class="line" d="M520 597H355v103"/><path class="line" d="M850 597h200v103"/>
