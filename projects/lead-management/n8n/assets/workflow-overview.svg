<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="850" viewBox="0 0 1440 850" role="img" aria-labelledby="title desc">
<title id="title">AI Lead Qualification and Automation Platform workflow</title><desc id="desc">Current 18-node active website-connected workflow. Webhook intake is normalized, qualified by an OpenRouter AI agent, parsed and recorded in Google Sheets, then routed into high-value, qualified or lower-value follow-up paths with Gmail and status updates.</desc>
